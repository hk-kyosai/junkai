<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>パンフ台巡回</title>
<meta name="theme-color" content="#16202B">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="パンフ台巡回">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="apple-touch-icon-fallback" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2316202B'/%3E%3Ccircle cx='90' cy='72' r='24' fill='none' stroke='%23fff' stroke-width='10'/%3E%3Cpath d='M90 108c0 24-30 30-30 30h60s-30-6-30-30z' fill='%23fff'/%3E%3Ccircle cx='90' cy='72' r='8' fill='%23CC2B2B'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --ink:#16202B; --ink-2:#5A6875; --line:#D8DFE6;
  --navy:#1B4D8F;
  --seimei:#1B6E8F; --kasai:#8A5A2B;
  --due:#CC2B2B; --soon:#B87400; --ok:#2E7D5B;
  --shadow:0 1px 2px rgba(22,32,43,.07), 0 4px 14px rgba(22,32,43,.06);
  --tap:48px;
  --jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;
  --num:ui-monospace,"SF Mono","Roboto Mono","Menlo",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:var(--jp); background:var(--paper); color:var(--ink);
  font-size:15px; line-height:1.5; overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--paper)}
header{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 0; flex:none;
}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.brand h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.02em}
.brand .count{font-family:var(--num);font-size:12px;color:var(--ink-2)}

/* ---------- radar (signature) ---------- */
#radar{
  display:none;background:var(--ink);color:#fff;margin:0 -14px;padding:10px 14px 12px;
}
#radar.on{display:block}
.radar-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;
  letter-spacing:.12em;color:#9FB0C0;margin-bottom:8px}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ADE80;margin-right:6px;
  animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.radar-row{display:flex;align-items:center;gap:10px;padding:5px 0}
.radar-row+.radar-row{border-top:1px solid rgba(255,255,255,.09)}
.radar-dist{font-family:var(--num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
  min-width:78px;text-align:right;letter-spacing:-.02em}
.radar-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.radar-tag{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:700;flex:none}
.radar-empty{font-size:12px;color:#9FB0C0;padding:6px 0}

/* ---------- filters ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:13px;white-space:nowrap;transition:.12s}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;gap:8px;padding-bottom:10px}
.tools input[type=search]{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);
  border-radius:9px;background:var(--paper)}
.tools select{padding:9px 8px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}

/* ---------- main ---------- */
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px 24px}
.panel{display:none}
.panel.on{display:block}

/* ---------- card ---------- */
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);margin-bottom:9px;
  display:flex;overflow:hidden}
.edge{width:5px;flex:none}
.card-body{flex:1;min-width:0;padding:11px 12px}
.card-top{display:flex;align-items:flex-start;gap:10px}
.card-name{font-weight:700;font-size:14.5px;line-height:1.35;flex:1;min-width:0}
.card-sub{font-size:11.5px;color:var(--ink-2);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.days{font-family:var(--num);text-align:right;flex:none;line-height:1}
.days b{display:block;font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.days span{font-size:10px;letter-spacing:.02em;color:var(--ink-2)}
.meters{display:flex;gap:7px;margin-top:9px}
.meter{flex:1;background:var(--paper);border-radius:6px;padding:5px 7px}
.meter-top{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;margin-bottom:4px}
.meter-top em{font-style:normal;font-weight:700;letter-spacing:.04em}
.meter-top i{font-style:normal;font-family:var(--num);color:var(--ink-2)}
.bar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar>div{height:100%;border-radius:2px}
.card-actions{display:flex;gap:7px;margin-top:10px}
.btn{flex:1;height:38px;border-radius:8px;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:5px}
.btn-fill{background:var(--ink);color:#fff}
.btn-line{border:1px solid var(--line);background:var(--surface)}
.dist-pill{font-family:var(--num);font-size:11px;color:var(--ink-2);
  background:var(--paper);padding:2px 7px;border-radius:5px;margin-left:6px}

/* ---------- tabs ---------- */
nav{display:flex;background:var(--surface);border-top:1px solid var(--line);flex:none;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:var(--tap);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:10px;color:var(--ink-2);letter-spacing:0}
nav button[aria-pressed="true"]{color:var(--navy);font-weight:700;box-shadow:inset 0 2px 0 var(--navy)}
nav svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}

/* ---------- map ---------- */
#map-wrap{position:relative;height:62dvh;min-height:320px;border-radius:12px;overflow:hidden;
  box-shadow:var(--shadow);background:var(--surface)}
#map{position:absolute;inset:0;display:none}
#map.on{display:block}
#svgmap{position:absolute;inset:0;width:100%;height:100%;display:none;background:#F4F7FA}
#svgmap.on{display:block}
#svgmap .sea{fill:#DCE6EE}
#svgmap .grid{stroke:#C9D6E0;stroke-width:.7;stroke-dasharray:3 4}
#svgmap .lbl{font-family:var(--num);font-size:11px;fill:#8496A6}
#svgmap .place{font-family:var(--jp);font-size:15px;font-weight:700;fill:#5A6875;
  paint-order:stroke;stroke:#F4F7FA;stroke-width:4px;stroke-linejoin:round}
#svgmap circle.pin{stroke:#fff;stroke-width:1.4;cursor:pointer}
#svgmap circle.pin:hover{stroke-width:2.4}
#locate{position:absolute;right:10px;top:10px;z-index:500;width:42px;height:42px;
  border-radius:11px;background:var(--surface);box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
#locate.on{color:var(--navy)}
#locate svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
#map-msg{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(22,32,43,.9);
  color:#fff;font-size:11.5px;line-height:1.55;padding:9px 11px;border-radius:8px;display:none}
#map-msg.on{display:block}
#map-msg button{text-decoration:underline;font-weight:700;margin-left:6px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);
  padding:9px 2px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(22,32,43,.45);display:none;z-index:900}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;background:var(--surface);
  border-radius:16px 16px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);
  max-width:560px;margin:0 auto;transform:translateY(101%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  max-height:88dvh;overflow-y:auto}
.sheet.on{transform:none}
.sheet h2{font-size:16px;margin:0 0 2px}
.sheet .addr{font-size:12px;color:var(--ink-2);margin-bottom:14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.field .hint{font-weight:400;color:var(--ink-2);margin-left:5px}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:52px;font-size:20px;background:var(--paper);color:var(--ink-2)}
.stepper input{flex:1;min-width:0;text-align:center;border:0;font-family:var(--num);
  font-size:19px;font-weight:600;background:var(--surface)}
.row2{display:flex;gap:9px}
.row2>*{flex:1;min-width:0}
.note{background:var(--paper);border-radius:9px;padding:10px 11px;font-size:12px;
  color:var(--ink-2);line-height:1.6;margin-bottom:13px}
.note b{color:var(--ink);font-family:var(--num)}

/* ---------- alert takeover ---------- */
#alert{position:fixed;inset:0;z-index:1000;background:var(--due);color:#fff;display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:26px 22px calc(env(safe-area-inset-bottom) + 26px);gap:6px}
#alert.on{display:flex;animation:sirenIn .3s ease-out}
#alert.on::before{content:'';position:absolute;inset:0;background:#fff;opacity:0;
  animation:siren 1.3s ease-in-out infinite;pointer-events:none}
@keyframes sirenIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes siren{0%,100%{opacity:0}45%{opacity:.16}}
#alert>*{position:relative;z-index:1}
#alert .lead{font-size:15px;font-weight:700;letter-spacing:.04em;opacity:.9}
#alert h3{font-size:34px;margin:8px 0 0;line-height:1.25;font-weight:800;
  text-wrap:balance;max-width:14em}
#alert .d{font-family:var(--num);font-size:76px;font-weight:700;letter-spacing:-.04em;
  margin:10px 0 2px;line-height:1}
#alert .addr{font-size:15px;opacity:.9;max-width:22em}
#alert .left{font-size:17px;font-weight:700;margin-top:8px;
  background:rgba(255,255,255,.18);padding:5px 14px;border-radius:999px}
#alert .acts{display:flex;gap:11px;margin-top:26px;width:100%;max-width:400px}
#alert .acts button{flex:1;height:62px;border-radius:13px;font-weight:800;font-size:17px}
.a-primary{background:#fff;color:var(--due)}
.a-ghost{border:2px solid rgba(255,255,255,.65);color:#fff}
.a-nav{margin-top:11px;width:100%;max-width:400px;height:52px;border-radius:13px;
  background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:15px}

/* ---------- route ---------- */
.route-sum{display:flex;gap:8px;margin-top:4px}
.route-sum>div{flex:1;background:var(--paper);border-radius:8px;padding:8px 6px;text-align:center}
.route-sum b{display:block;font-family:var(--num);font-size:20px;font-weight:600;letter-spacing:-.02em}
.route-sum span{font-size:10px;color:var(--ink-2)}
.stop{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:11px;
  box-shadow:var(--shadow);padding:9px 11px;margin-bottom:7px}
.stop-no{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;flex:none;
  font-family:var(--num);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stop-body{flex:1;min-width:0}
.stop-name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop-sub{font-size:11.5px;color:var(--ink-2);margin-top:1px}
.stop-ops{display:flex;gap:2px;flex:none}
.stop-ops button{width:30px;height:30px;border-radius:7px;color:var(--ink-2);font-size:12px}
.stop-ops button:active{background:var(--paper)}
.add-row{display:flex;align-items:center;gap:9px;width:100%;padding:9px 2px;text-align:left;
  border-top:1px solid var(--line)}
.add-plus{width:22px;height:22px;border-radius:6px;background:var(--paper);color:var(--navy);
  font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-size:13px}
.add-name{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add-sub{font-family:var(--num);font-size:11px;color:var(--ink-2);flex:none}

/* ---------- settings ---------- */
.setting{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);
  padding:13px 14px;margin-bottom:9px}
.setting h3{font-size:13px;margin:0 0 3px}
.setting p{font-size:12px;color:var(--ink-2);margin:0 0 11px;line-height:1.6}
.setting .row{display:flex;align-items:center;gap:10px}
.setting input[type=range]{flex:1}
.val{font-family:var(--num);font-size:13px;min-width:62px;text-align:right}
.empty{text-align:center;color:var(--ink-2);font-size:13px;padding:44px 20px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;
  opacity:0;transition:.22s;z-index:950;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2.5px solid var(--navy);outline-offset:2px}
</style>

<div id="app">
  <header>
    <div class="brand">
      <h1>パンフ台巡回</h1>
      <span class="count" id="count"></span>
    </div>

    <div id="radar">
      <div class="radar-head">
        <span><span class="pulse"></span>巡回中 — 近い順</span>
        <span id="radar-acc"></span>
      </div>
      <div id="radar-list"></div>
    </div>

    <div class="tools" id="tools">
      <input type="search" id="q" placeholder="店名・住所で探す" autocomplete="off">
      <select id="sort">
        <option value="days">残日数順</option>
        <option value="dist">近い順</option>
        <option value="name">名前順</option>
      </select>
    </div>
    <div class="filters" id="filters"></div>
  </header>

  <main>
    <section class="panel on" id="p-list"><div id="list"></div></section>
    <section class="panel" id="p-map">
      <div id="map-wrap">
        <div id="map"></div>
        <svg id="svgmap" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
        <button id="locate" onclick="locateMe()" aria-label="現在地を表示">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke-linecap="round"/></svg>
        </button>
        <div id="map-msg"></div>
      </div>
      <div class="legend">
        <span><i style="background:var(--due)"></i>要補充</span>
        <span><i style="background:var(--soon)"></i>間もなく</span>
        <span><i style="background:var(--ok)"></i>まだ余裕</span>
        <span><i style="background:#8898A8"></i>未記録</span>
      </div>
    </section>
    <section class="panel" id="p-route"></section>
    <section class="panel" id="p-set"></section>
  </main>

  <nav>
    <button id="t-list" aria-pressed="true" onclick="tab('list')">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>一覧</button>
    <button id="t-map" aria-pressed="false" onclick="tab('map')">
      <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2ZM9 4v14M15 6v14" stroke-linejoin="round"/></svg>地図</button>
    <button id="t-route" aria-pressed="false" onclick="tab('route')">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19h6a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7h6" stroke-linecap="round"/></svg>ルート</button>
    <button id="t-set" aria-pressed="false" onclick="tab('set')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" stroke-linecap="round"/></svg>設定</button>
  </nav>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div id="alert"></div>

/* ===== 保存層：アーティファクト内では window.storage、単独ホスト時は localStorage ===== */
const store = {
  async get(k){
    try{
      if(window.storage){ const r = await window.storage.get(k); return r ? JSON.parse(r.value) : null; }
      const v = localStorage.getItem(k); return v ? JSON.parse(v) : null;
    }catch(e){ return null; }
  },
  async set(k,v){
    try{
      if(window.storage) return await window.storage.set(k, JSON.stringify(v));
      localStorage.setItem(k, JSON.stringify(v));
    }catch(e){ toast('保存できませんでした'); }
  }
};

let visits = [];      // {id, date:'YYYY-MM-DD', p:'s'|'f', before, after}
let cfg = { safety:0.8, rateS:1.0, rateF:0.6, min:7, max:90, soon:7, radius:300,
            alertScope:'due', alarmSec:30, volume:0.5 };
let pos = null, watchId = null, alerted = {}, map = null, markers = null;
let ui = { tab:'list', q:'', sort:'days', kubun:'all', city:'all', status:'all' };

const todayStr = () => new Date().toISOString().slice(0,10);
const dayDiff = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);

/* ===== 補充周期の計算 ===== */
function compute(place){
  const mine = visits.filter(v => v.id === place.id).sort((a,b)=> a.date < b.date ? -1 : 1);
  const out = {};
  for(const [key,prod,stock,def] of [['s','s',place.ps,cfg.rateS],['f','f',place.pf,cfg.rateF]]){
    const vs = mine.filter(v => v.p === prod);
    let used = 0, days = 0;
    for(let i=1;i<vs.length;i++){
      const d = dayDiff(vs[i-1].date, vs[i].date);
      if(d > 0){ used += (vs[i-1].after - vs[i].before); days += d; }
    }
    const rate = (days > 0 && used > 0) ? used / days : def;
    const cycle = Math.min(cfg.max, Math.max(cfg.min, Math.round(stock * cfg.safety / rate)));
    out[key] = { rate, cycle, last: vs.length ? vs[vs.length-1] : null, stock };
  }
  const last = mine.length ? mine[mine.length-1].date : null;
  const cycle = Math.min(out.s.cycle, out.f.cycle);
  const next = last ? new Date(new Date(last).getTime() + cycle*86400000).toISOString().slice(0,10) : null;
  const left = next ? dayDiff(todayStr(), next) : null;
  const status = left === null ? 'none' : left <= 0 ? 'due' : left <= cfg.soon ? 'soon' : 'ok';
  return { ...out, last, cycle, next, left, status };
}
const STATUS = {
  due:{label:'要補充', color:'var(--due)'}, soon:{label:'間もなく', color:'var(--soon)'},
  ok:{label:'まだ余裕', color:'var(--ok)'}, none:{label:'未記録', color:'#8898A8'}
};

/* ===== 距離 ===== */
function distance(a,b,c,d){
  const R=6371000, r=Math.PI/180;
  const dLat=(c-a)*r, dLng=(d-b)*r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
const fmtDist = m => m == null ? '' : m < 1000 ? Math.round(m/10)*10 + ' m' : (m/1000).toFixed(m < 10000 ? 1 : 0) + ' km';

/* ===== 一覧の組み立て ===== */
function rows(){
  const q = ui.q.trim();
  let list = PLACES.map(p => {
    const c = compute(p);
    const d = pos ? distance(pos.lat, pos.lng, p.lat, p.lng) : null;
    return { p, c, d };
  });
  if(ui.kubun !== 'all') list = list.filter(r => r.p.k === ui.kubun);
  if(ui.city !== 'all')  list = list.filter(r => r.p.c === ui.city);
  if(ui.status !== 'all') list = list.filter(r => ui.status === 'todo'
      ? (r.c.status === 'due' || r.c.status === 'soon') : r.c.status === ui.status);
  if(q) list = list.filter(r => r.p.n.includes(q) || r.p.a.includes(q));

  const by = {
    days: (a,b) => (a.c.left ?? 9e3) - (b.c.left ?? 9e3),
    dist: (a,b) => (a.d ?? 9e9) - (b.d ?? 9e9),
    name: (a,b) => a.p.n.localeCompare(b.p.n, 'ja')
  }[ui.sort];
  return list.sort(by);
}

/* ===== 描画 ===== */
function render(){
  const list = rows();
  document.getElementById('count').textContent = list.length + ' / ' + PLACES.length + ' 件';
  const box = document.getElementById('list');

  if(!list.length){
    box.innerHTML = '<div class="empty">条件に合う設置先がありません。<br>絞り込みを変えてみてください。</div>';
  } else {
    box.innerHTML = list.slice(0, 200).map(({p,c,d}) => {
      const st = STATUS[c.status];
      const meter = (k, label, color) => {
        const o = c[k];
        const remain = c.last ? Math.max(0, Math.round(o.stock - o.rate * dayDiff(c.last, todayStr()))) : o.stock;
        return `<div class="meter">
          <div class="meter-top"><em style="color:${color}">${label}</em><i>残 ${remain}枚</i></div>
          <div class="bar"><div style="width:${Math.max(3, Math.round(100*remain/o.stock))}%;background:${color}"></div></div>
        </div>`;
      };
      return `<article class="card">
        <div class="edge" style="background:${st.color}"></div>
        <div class="card-body">
          <div class="card-top">
            <div style="flex:1;min-width:0">
              <div class="card-name">${p.n}</div>
              <div class="card-sub">${p.c}・${p.g}${d != null ? `<span class="dist-pill">${fmtDist(d)}</span>` : ''}</div>
            </div>
            <div class="days" style="color:${st.color}">
              ${c.left === null ? '<b>—</b><span>未記録</span>'
                : `<b>${c.left > 0 ? c.left : Math.abs(c.left)}</b><span>${c.left > 0 ? '日後' : c.left === 0 ? '今日' : '日超過'}</span>`}
            </div>
          </div>
          <div class="meters">
            ${meter('s','生命共済','var(--seimei)')}
            ${meter('f','火災共済','var(--kasai)')}
          </div>
          <div class="card-actions">
            <button class="btn btn-fill" onclick="openSheet(${p.id})">補充を記録</button>
            <button class="btn btn-line" onclick="navTo(${p.lat},${p.lng})">ナビ</button>
          </div>
        </div>
      </article>`;
    }).join('');
  }
  if(mapMode) drawMarkers();
  renderRadar();
}

const num = (id,label,val) => `<div>
  <div style="font-size:11px;color:var(--ink-2);margin-bottom:4px">${label}</div>
  <div class="stepper">
    <button onclick="bump('${id}',-1)" aria-label="減らす">−</button>

/* ===== ナビ ===== */
function navTo(lat,lng){
  window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`, '_blank');
}

/* ===== 巡回ルート =====
   Googleマップは経由地が最大9か所（出発地・目的地を除く）なので、
   1ルートあたり10件を上限にしています。 */
const ROUTE_MAX = 10;
let routeStart = null;     // {lat,lng,label}
let routePicked = [];      // 訪問順に並んだ id の配列
let routeAuto = true;      // 近い順に自動で組むか

function routeCandidates(){
  return rows().filter(r => r.c.status === 'due' || r.c.status === 'soon');
}
/* 現在地から近い順に手繰る（最近傍法）。総当たりはしないが実用上これで十分 */
function buildRoute(){
  const cands = routeCandidates().map(r => r.p);
  const start = routeStart || (pos ? {lat:pos.lat, lng:pos.lng} : null);
  if(!start){ routePicked = cands.slice(0, ROUTE_MAX).map(p => p.id); return; }
  const pool = cands.slice();
  const order = [];
  let cur = start;
  while(pool.length && order.length < ROUTE_MAX){
    let best = 0, bestD = Infinity;
    pool.forEach((p, i) => {
      const d = distance(cur.lat, cur.lng, p.lat, p.lng);
      if(d < bestD){ bestD = d; best = i; }
    });
    cur = pool[best];
    order.push(pool[best].id);
    pool.splice(best, 1);
  }
  routePicked = order;
}
function routeLegs(){
  const start = routeStart || (pos ? {lat:pos.lat, lng:pos.lng, label:'現在地'} : null);
  const stops = routePicked.map(id => PLACES.find(p => p.id === id));
  let total = 0, prev = start;
  const legs = stops.map(p => {
    const d = prev ? distance(prev.lat, prev.lng, p.lat, p.lng) : null;
    if(d) total += d;
    prev = p;
    return {p, d, c:compute(p)};
  });
  return {legs, total, start};
}
function routeUrl(){
  const {start} = routeLegs();
  const stops = routePicked.map(id => PLACES.find(p => p.id === id));
  if(!stops.length) return null;
  const dest = stops[stops.length - 1];
  const via = stops.slice(0, -1).map(p => `${p.lat},${p.lng}`).join('|');
  let u = 'https://www.google.com/maps/dir/?api=1';
  if(start) u += `&origin=${start.lat},${start.lng}`;
  u += `&destination=${dest.lat},${dest.lng}&travelmode=driving`;
  if(via) u += `&waypoints=${encodeURIComponent(via)}`;
  return u;
}
function openRoute(){
  const u = routeUrl();
  if(!u) return toast('ルートに入れる設置先がありません');
  window.open(u, '_blank');
}
function routeToggle(id){
  const i = routePicked.indexOf(id);
  if(i >= 0) routePicked.splice(i, 1);
  else if(routePicked.length >= ROUTE_MAX) return toast(`1ルートは${ROUTE_MAX}件までです`);
  else routePicked.push(id);
  routeAuto = false;
  renderRoute();
}
function routeMove(i, dir){
  const j = i + dir;
  if(j < 0 || j >= routePicked.length) return;
  [routePicked[i], routePicked[j]] = [routePicked[j], routePicked[i]];
  routeAuto = false;
  renderRoute();
}
function routeRebuild(){ routeAuto = true; buildRoute(); renderRoute(); toast('近い順に組み直しました'); }
function routeClear(){ routePicked = []; routeAuto = false; renderRoute(); }

function renderRoute(){
  if(routeAuto && !routePicked.length) buildRoute();
  const {legs, total, start} = routeLegs();
  const cands = routeCandidates();
  const rest = cands.filter(r => !routePicked.includes(r.p.id));

  document.getElementById('p-route').innerHTML = `
    <div class="setting">
      <h3>今日回るルート</h3>
      <p>${start ? '現在地から' : '出発地を決めずに'}、補充が必要な設置先を近い順につなぎます。
         Googleマップに送るとCarPlayやAndroid Autoの画面にもルートが出ます。</p>
      ${!start ? `<p style="color:var(--soon);margin:-6px 0 11px">
        現在地が未取得です。設定タブで巡回モードを開始すると、いる場所から近い順に組めます。</p>` : ''}
      <div class="route-sum">
        <div><b>${legs.length}</b><span>件</span></div>
        <div><b>${total ? (total/1000).toFixed(1) : '—'}</b><span>km（直線）</span></div>
        <div><b>${cands.length}</b><span>要補充+間もなく</span></div>
      </div>
      <button class="btn btn-fill" style="width:100%;margin-top:11px"
        onclick="openRoute()">Googleマップでルートを開く</button>
      <div class="card-actions" style="margin-top:8px">
        <button class="btn btn-line" onclick="routeRebuild()">近い順に組み直す</button>
        <button class="btn btn-line" onclick="routeClear()">空にする</button>
      </div>
    </div>

    ${legs.length ? legs.map(({p,d,c}, i) => `
      <div class="stop">
        <div class="stop-no">${i + 1}</div>
        <div class="stop-body">
          <div class="stop-name">${p.n}</div>
          <div class="stop-sub">${d != null ? fmtDist(d) + '・' : ''}${STATUS[c.status].label}
            ${c.left !== null ? `（${c.left > 0 ? 'あと' + c.left + '日' : Math.abs(c.left) + '日超過'}）` : ''}</div>
        </div>
        <div class="stop-ops">
          <button onclick="routeMove(${i},-1)" aria-label="上へ">▲</button>
          <button onclick="routeMove(${i},1)" aria-label="下へ">▼</button>
          <button onclick="routeToggle(${p.id})" aria-label="外す">✕</button>
        </div>
      </div>`).join('')
      : '<div class="empty">補充が必要な設置先がまだありません。<br>訪問を記録すると、ここに巡回ルートが出ます。</div>'}

    ${rest.length ? `<div class="setting" style="margin-top:12px">
      <h3>ルートに追加できる設置先</h3>
      <p>あと${Math.max(0, ROUTE_MAX - legs.length)}件まで入れられます。</p>
      ${rest.slice(0, 30).map(({p,c,d}) => `
        <button class="add-row" onclick="routeToggle(${p.id})">
          <span class="add-plus">＋</span>
          <span class="add-name">${p.n}</span>
          <span class="add-sub">${d != null ? fmtDist(d) : STATUS[c.status].label}</span>
        </button>`).join('')}
    </div>` : ''}`;
}

/* ===== 地図 =====
   外部の地図ライブラリが読めない環境でも必ず何か出るよう、二段構えにしています。
   1. Leaflet + OpenStreetMap のタイル地図（読み込めた場合）
   2. 内蔵のSVG地図（外部読み込み不要。座標をそのまま点で描画） */
let mapMode = null;   // 'tile' | 'svg'
let leafletTried = false;

function initMap(){
  if(mapMode) { if(mapMode === 'tile' && map) setTimeout(()=>map.invalidateSize(), 50); return; }
  if(leafletTried) return;
  leafletTried = true;
  showSvgMap('地図を読み込んでいます…', false);
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css',
    () => buildTileMap(), () => showSvgMap('通信できないため簡易地図で表示しています。', true));
}
function loadScript(js, css, ok, ng){
  const link = document.createElement('link');
  link.rel = 'stylesheet'; link.href = css;
  document.head.appendChild(link);
  const s = document.createElement('script');
  s.src = js;
  const timer = setTimeout(() => { if(!window.L) ng(); }, 6000);
  s.onload = () => { clearTimeout(timer); window.L ? ok() : ng(); };
  s.onerror = () => { clearTimeout(timer); ng(); };
  document.head.appendChild(s);
}
function buildTileMap(){
  try{
    mapMode = 'tile';
    document.getElementById('svgmap').classList.remove('on');
    document.getElementById('map-msg').classList.remove('on');
    document.getElementById('map').classList.add('on');
    map = L.map('map', {zoomControl:true}).setView([34.45, 132.85], 9);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:18, attribution:'&copy; OpenStreetMap'}).addTo(map);
    markers = L.layerGroup().addTo(map);
    drawMarkers();
    setTimeout(() => map.invalidateSize(), 60);
  }catch(e){
    mapMode = null;
    showSvgMap('地図を表示できないため簡易地図に切り替えました。', true);
  }
}
function showSvgMap(msg, isFallback){
  mapMode = isFallback ? 'svg' : mapMode;
  document.getElementById('map').classList.remove('on');
  document.getElementById('svgmap').classList.add('on');
  const m = document.getElementById('map-msg');
  m.innerHTML = msg + (isFallback
    ? '<button onclick="retryTiles()">通常の地図を再試行</button>' : '');
  m.classList.add('on');
  drawSvgMap();
}
function retryTiles(){
  leafletTried = false; mapMode = null;
  document.getElementById('map-msg').classList.remove('on');
  initMap();
}

/* --- 内蔵SVG地図：緯度経度をそのまま平面に落とす --- */
function drawSvgMap(){
  const svg = document.getElementById('svgmap');
  const list = rows();
  const all = PLACES;
  const lats = all.map(p => p.lat), lngs = all.map(p => p.lng);
  const pad = 0.06;
  const minLat = Math.min(...lats) - pad, maxLat = Math.max(...lats) + pad;
  const minLng = Math.min(...lngs) - pad, maxLng = Math.max(...lngs) + pad;
  const W = 1000, H = 700;
  // 緯度方向の距離が縮む分を補正して縦横比を合わせる
  const kx = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
  const spanX = (maxLng - minLng) * kx, spanY = maxLat - minLat;
  const scale = Math.min(W / spanX, H / spanY);
  const offX = (W - spanX * scale) / 2, offY = (H - spanY * scale) / 2;
  const X = lng => offX + (lng - minLng) * kx * scale;
  const Y = lat => H - offY - (lat - minLat) * scale;

  let g = '<rect class="sea" x="0" y="0" width="1000" height="700"/>';
  for(let v = Math.ceil(minLng * 5) / 5; v < maxLng; v += 0.2)
    g += `<line class="grid" x1="${X(v).toFixed(1)}" y1="0" x2="${X(v).toFixed(1)}" y2="700"/>`
      +  `<text class="lbl" x="${(X(v)+3).toFixed(1)}" y="694">${v.toFixed(1)}°E</text>`;
  for(let v = Math.ceil(minLat * 5) / 5; v < maxLat; v += 0.2)
    g += `<line class="grid" x1="0" y1="${Y(v).toFixed(1)}" x2="1000" y2="${Y(v).toFixed(1)}"/>`
      +  `<text class="lbl" x="4" y="${(Y(v)-4).toFixed(1)}">${v.toFixed(1)}°N</text>`;

  // 市区町村ごとの重心に地名を置いて、点だけでも位置が分かるようにする
  const hub = {};
  all.forEach(p => {
    (hub[p.c] = hub[p.c] || {n:0, lat:0, lng:0}).n++;
    hub[p.c].lat += p.lat; hub[p.c].lng += p.lng;
  });
  Object.entries(hub).filter(([,v]) => v.n >= 4).forEach(([city,v]) => {
    g += `<text class="place" x="${X(v.lng / v.n).toFixed(1)}" y="${(Y(v.lat / v.n) - 13).toFixed(1)}"
           text-anchor="middle">${city}</text>`;
  });

  const shown = new Set(list.map(r => r.p.id));
  // 絞り込みで外れた先は薄く残して位置関係が分かるようにする
  all.forEach(p => {
    if(shown.has(p.id)) return;
    g += `<circle cx="${X(p.lng).toFixed(1)}" cy="${Y(p.lat).toFixed(1)}" r="2.5"
           fill="#B6C4D0" stroke="none"/>`;
  });
  list.forEach(({p,c}) => {
    g += `<circle class="pin" cx="${X(p.lng).toFixed(1)}" cy="${Y(p.lat).toFixed(1)}" r="6"
           fill="${STATUS[c.status].color}" onclick="openSheet(${p.id})">
           <title>${p.n}（${STATUS[c.status].label}）</title></circle>`;
  });
  if(pos && pos.lng >= minLng && pos.lng <= maxLng && pos.lat >= minLat && pos.lat <= maxLat){
    g += `<circle cx="${X(pos.lng).toFixed(1)}" cy="${Y(pos.lat).toFixed(1)}" r="13"
           fill="#1B4D8F" opacity=".22"/>
          <circle cx="${X(pos.lng).toFixed(1)}" cy="${Y(pos.lat).toFixed(1)}" r="5"
           fill="#1B4D8F" stroke="#fff" stroke-width="2"/>`;
  }
  svg.innerHTML = g;
}

let meMarker = null, meCircle = null;
function drawMe(){
  if(mapMode !== 'tile' || !map) return;
  if(!pos){
    if(meMarker){ map.removeLayer(meMarker); map.removeLayer(meCircle); meMarker = meCircle = null; }
    return;
  }
  const ll = [pos.lat, pos.lng];
  if(meMarker){
    meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(pos.acc);
  }else{
    meCircle = L.circle(ll, {radius:pos.acc, color:'#1B4D8F', weight:1,
      fillColor:'#1B4D8F', fillOpacity:.12}).addTo(map);
    meMarker = L.circleMarker(ll, {radius:7, color:'#fff', weight:3,
      fillColor:'#1B4D8F', fillOpacity:1}).addTo(map);
  }
}

/* 現在地ボタン：未開始なら巡回モードを起動し、取得済みならその位置へ寄せる */
function locateMe(){
  if(!watchId){ toggleWatch(); toast('現在地を取得しています…'); return; }
  if(!pos) return toast('現在地を取得しています…');
  if(mapMode === 'tile' && map) map.setView([pos.lat, pos.lng], 15);
  else drawSvgMap();
  toast('現在地に移動しました');
}

function drawMarkers(){
  if(mapMode === 'svg'){ drawSvgMap(); return; }
  if(!markers) return;
  drawMe();
  markers.clearLayers();
  rows().forEach(({p,c}) => {
    L.circleMarker([p.lat,p.lng], {
      radius:6, color:'#fff', weight:1.5, fillColor:STATUS[c.status].color, fillOpacity:.95
    }).bindPopup(
      `<b>${p.n}</b><br>${p.a}<br>${STATUS[c.status].label}` +
      (c.next ? `（次回 ${c.next}）` : '') +
      `<br><a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank">ナビを開く</a>`
    ).addTo(markers);
  });
}

/* ===== 位置監視と近接アラート ===== */
function toggleWatch(){
  if(watchId){
    navigator.geolocation.clearWatch(watchId); watchId = null; pos = null;
    renderSettings(); render(); toast('巡回モードを終了しました');
    return;
  }
  if(!navigator.geolocation) return toast('この端末では位置情報を使えません');
  if('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  watchId = navigator.geolocation.watchPosition(p => {
    pos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy};
    checkProximity(); render(); renderSettings();
  }, err => {
    const msg = {
      1:'位置情報が許可されていません。ブラウザのアドレスバーの鍵マークから許可してください',
      2:'現在地を取得できません。屋外に出るか、端末の位置情報をオンにしてください',
      3:'現在地の取得に時間がかかっています。そのままお待ちください'
    }[err.code] || '位置情報を取得できませんでした';
    toast(msg);
    if(err.code !== 3){ navigator.geolocation.clearWatch(watchId); watchId = null; }
    renderSettings(); render();
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:30000});
  renderSettings(); render(); toast('巡回モードを開始しました');
}
function checkProximity(){
  if(!pos) return;
  for(const p of PLACES){
    const c = compute(p);
    const want = cfg.alertScope === 'all' ? true
               : cfg.alertScope === 'due' ? c.status === 'due'
               : (c.status === 'due' || c.status === 'soon');
    const d = distance(pos.lat, pos.lng, p.lat, p.lng);
    if(want && d <= cfg.radius && !alerted[p.id]){
      alerted[p.id] = true; fireAlert(p, c, d);
    }
    if(alerted[p.id] && d > cfg.radius * 2.5) delete alerted[p.id];  // 離れたら再武装
  }
}
function fireAlert(p, c, d, isTest){
  startAlarm();
  if('Notification' in window && Notification.permission === 'granted')
    new Notification(isTest ? 'テスト通知' : '補充対象が近くにあります',
      {body:`${p.n}${d == null ? '' : `（約${fmtDist(d)}）`}`});
  const a = document.getElementById('alert');
  a.innerHTML = `
    <div class="lead">${isTest ? 'これはテスト通知です' : '補充対象が近くにあります'}</div>
    <h3>${p.n}</h3>
    <div class="d">${d == null ? '—' : fmtDist(d)}</div>
    <div class="addr">${p.a}</div>
    <div class="left">${c.left === null ? '未記録' : c.left <= 0 ? Math.abs(c.left) + '日超過' : 'あと' + c.left + '日'}</div>
    <div class="acts">
      <button class="a-ghost" onclick="dismissAlert()">あとで</button>
      <button class="a-primary" onclick="dismissAlert();openSheet(${p.id})">補充を記録</button>
    </div>
    <button class="a-nav" onclick="stopAlarm();navTo(${p.lat},${p.lng})">ここへナビを開く</button>`;
  a.style.background = isTest ? 'var(--navy)' : 'var(--due)';
  a.querySelector('.a-primary').style.color = isTest ? 'var(--navy)' : 'var(--due)';
  a.classList.add('on');
}
/* テスト用：いちばん近い設置先（未測位なら先頭）で通知を1回出す */
function testAlert(){
  if('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  let target = PLACES[0], d = null;
  if(pos){
    const sorted = PLACES.map(p => ({p, d:distance(pos.lat, pos.lng, p.lat, p.lng)}))
                         .sort((a,b) => a.d - b.d)[0];
    target = sorted.p; d = sorted.d;
  }
  fireAlert(target, compute(target), d, true);
}
function nearestDist(){
  if(!pos) return null;
  return Math.min(...PLACES.map(p => distance(pos.lat, pos.lng, p.lat, p.lng)));
}

/* ===== 通知音 =====
   運転中でも気づけるよう、二音のチャイムを繰り返し鳴らします。
   画面を消しても止まらないよう、停止は明示操作か時間切れのときだけ行います。 */
let audioCtx = null, alarmTimer = null, alarmStop = null;

function tone(at, freq, dur, vol){
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(freq, at);
  o.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(.0001, at);
  g.gain.exponentialRampToValueAtTime(vol, at + .015);
  g.gain.setValueAtTime(vol, at + dur - .08);
  g.gain.exponentialRampToValueAtTime(.0001, at + dur);
  o.start(at); o.stop(at + dur + .02);
}
function chime(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime, v = cfg.volume;
    // ピーン・ポーン を2回
    [0, .78].forEach(off => {
      tone(t + off,        988, .34, v);
      tone(t + off + .34,  740, .40, v);
    });
  }catch(e){}
}
function startAlarm(){
  stopAlarm();
  chime();
  if(navigator.vibrate) navigator.vibrate([500,220,500,220,700]);
  alarmTimer = setInterval(() => {
    chime();
    if(navigator.vibrate) navigator.vibrate([500,220,500,220,700]);
  }, 2600);
  if(cfg.alarmSec > 0) alarmStop = setTimeout(stopAlarm, cfg.alarmSec * 1000);
}
function stopAlarm(){
  clearInterval(alarmTimer); clearTimeout(alarmStop);
  alarmTimer = alarmStop = null;
  if(navigator.vibrate) navigator.vibrate(0);
}
function dismissAlert(){
  stopAlarm();
  document.getElementById('alert').classList.remove('on');
}

      ${pos ? `<p style="margin:10px 0 0">現在地 ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}（誤差 ±${Math.round(pos.acc)}m）</p>` : ''}
    </div>

    <div class="setting">
      <h3>通知する距離</h3>

      <div class="row">
        <input type="range" min="100" max="3000" step="50" value="${cfg.radius}"
          oninput="setCfg('radius', +this.value)">
        <span class="val">${cfg.radius >= 1000 ? (cfg.radius/1000).toFixed(2).replace(/0$/,'') + ' km' : cfg.radius + ' m'}</span>
      </div>
    </div>

    <div class="setting">
      <h3>通知の対象</h3>
      <p>期限切れだけにするか、間もなく期限を迎える先も含めるかを選べます。</p>
      <div class="row" style="gap:7px;flex-wrap:wrap">
        <button class="chip" aria-pressed="${cfg.alertScope==='due'}"
          onclick="setCfg('alertScope','due')">要補充のみ</button>
        <button class="chip" aria-pressed="${cfg.alertScope==='soon'}"
          onclick="setCfg('alertScope','soon')">間もなくも含める</button>
        <button class="chip" aria-pressed="${cfg.alertScope==='all'}"
          onclick="setCfg('alertScope','all')">すべて（テスト用）</button>
      </div>
      ${cfg.alertScope === 'all' ? `<p style="margin:10px 0 0;color:var(--due)">
        テスト用の設定です。補充が不要な設置先でも通知します。確認が済んだら戻してください。</p>` : ''}
    </div>

    <div class="setting">
      <h3>通知の鳴らし方</h3>
      <p>運転中でも気づけるよう、チャイムと振動を繰り返します。止めるまで鳴らし続ける設定もできます。</p>
      <div class="row" style="gap:7px;flex-wrap:wrap;margin-bottom:12px">
        ${[[10,'10秒'],[30,'30秒'],[60,'1分'],[0,'止めるまで']].map(([v,l]) =>
          `<button class="chip" aria-pressed="${cfg.alarmSec===v}"
             onclick="setCfg('alarmSec',${v})">${l}</button>`).join('')}
      </div>
      <div class="row">
        <span style="font-size:12px;color:var(--ink-2);min-width:32px">音量</span>
        <input type="range" min="0.1" max="1" step="0.1" value="${cfg.volume}"
          oninput="setCfg('volume', +this.value)">
        <span class="val">${Math.round(cfg.volume * 100)}%</span>
      </div>
      <p style="margin:11px 0 0">端末のマナーモードが優先されます。音を出したい場合はマナーモードを解除してください。振動は多くの端末でマナーモード中も動きます。</p>
    </div>

    <div class="setting">
      <h3>動作テスト</h3>
      <p>通知の見え方、音、振動をその場で確かめられます。実際に近づかなくても鳴らせます。</p>
      <button class="btn btn-line" style="width:100%;margin-bottom:8px" onclick="testAlert()">
        通知を1回鳴らしてみる</button>

async function setCfg(k,v){ cfg[k] = v; await store.set('cfg', cfg); renderSettings(); render(); }

function exportCSV(){
  if(!visits.length) return toast('書き出す記録がありません');
  const name = id => PLACES.find(p => p.id === id).n;
  const head = '訪問日,名称,商品,補充前の残数,補充後の枚数,担当者\n';
  const body = visits.slice().sort((a,b)=> a.date < b.date ? -1 : 1)
    .map(v => [v.date.replace(/-/g,'/'), name(v.id), v.p === 's' ? '生命共済' : '火災共済',
               v.before, v.after, ''].join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + head + body], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '補充履歴_' + todayStr() + '.csv';
  a.click();
  toast('CSVを書き出しました');
}
async function wipe(){
  if(!confirm('訪問記録をすべて消します。よろしいですか？')) return;
  visits = []; alerted = {};
  await store.set('visits', visits);
  render(); renderSettings(); toast('記録を消しました');
}

/* ===== 雑務 ===== */
function tab(name){
  ui.tab = name;
  ['list','map','route','set'].forEach(n => {
    document.getElementById('p-'+n).classList.toggle('on', n === name);
    document.getElementById('t-'+n).setAttribute('aria-pressed', n === name);
  });
  document.getElementById('tools').style.display = name === 'list' ? 'flex' : 'none';
  document.getElementById('filters').style.display = (name === 'set' || name === 'route') ? 'none' : 'flex';
  if(name === 'route') renderRoute();
  if(name === 'map'){
    initMap();
    if(!watchId) setTimeout(() => toast('右上のボタンで現在地を表示できます'), 400);
  }
  if(name === 'set') renderSettings();
}
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
document.getElementById('q').addEventListener('input', e => { ui.q = e.target.value; render(); });
document.getElementById('sort').addEventListener('change', e => { ui.sort = e.target.value; render(); });

/* ===== ホーム画面への追加とオフライン対応 ===== */
let installPrompt = null;
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installPrompt = e; renderSettings();
});
window.addEventListener('appinstalled', () => { installPrompt = null; renderSettings(); });
async function doInstall(){
  if(!installPrompt) return toast('ブラウザのメニューから「ホーム画面に追加」を選んでください');
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null; renderSettings();
}
const isStandalone = () =>
  window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

(async function init(){
  visits = (await store.get('visits')) || [];
  const saved = await store.get('cfg');
  if(saved) cfg = Object.assign(cfg, saved);
  renderFilters(); render(); renderSettings();
})();
</script>
